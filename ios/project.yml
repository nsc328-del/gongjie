name: Gongjie
options:
  developmentLanguage: zh-Hans
  bundleIdPrefix: app.gongjie
  deploymentTarget:
    iOS: '17.0'
packages:
  GongjieCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Gongjie:
    type: application
    platform: iOS
    sources:
      - path: Gongjie
    dependencies:
      - package: GongjieCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gongjie.native
        PRODUCT_NAME: Gongjie
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Gongjie/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
schemes:
  Gongjie:
    build:
      targets:
        Gongjie: all
    run:
      config: Debug
    archive:
      config: Release
