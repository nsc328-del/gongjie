<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>共界</title>
  <meta name="theme-color" content="#f3f0e7">
  <link rel="stylesheet" href="/static/styles.css?v=13">
</head>
<body>
  <div class="grain"></div>
  <div class="worldstream" aria-hidden="true">
    <i class="stream-orb orb-one"></i>
    <i class="stream-orb orb-two"></i>
    <i class="stream-orb orb-three"></i>
    <span class="stream-thread thread-one"></span>
    <span class="stream-thread thread-two"></span>
    <span class="stream-sigil"><i></i><i></i><i></i></span>
  </div>

  <section id="library-screen" class="library-screen">
    <header class="library-header">
      <button class="brand" data-action="library" aria-label="共界世界书架">
        <span class="brand-mark"><i></i><i></i><i></i></span><span>共界</span>
      </button>
      <div class="library-actions">
        <span id="library-provider-state" class="provider-state"><i></i><span>未连接</span></span>
        <button class="soft-button" data-action="settings">模型设置</button>
      </div>
    </header>
    <main class="library-main">
      <div class="library-intro">
        <div>
          <span class="stage-eyebrow">BOUNDLESS WORLDS</span>
          <h1>去往哪个世界</h1>
        </div>
        <div class="library-portal" aria-hidden="true"><i></i><i></i><i></i><span>∞</span></div>
      </div>
      <div id="world-library-grid" class="world-library-grid"></div>
    </main>
  </section>

  <div id="world-shell" class="app-shell hidden">
    <aside class="left-rail">
      <button class="brand" data-action="library" aria-label="返回世界书架">
        <span class="brand-mark"><i></i><i></i><i></i></span><span>共界</span>
      </button>
      <button class="world-return" data-action="world-home">
        <small>当前世界</small><strong id="world-name-side">—</strong><span>回到全景</span>
      </button>
      <nav class="main-nav">
        <button class="nav-button active" data-action="world-home"><span>◌</span>世界全景</button>
      </nav>
      <div class="rail-label"><span>人物</span><b id="character-count">0</b></div>
      <div id="character-list" class="character-list"></div>
      <div class="rail-bottom">
        <div id="provider-state" class="provider-state"><i></i><span>未连接</span></div>
        <button class="icon-button" data-action="settings" aria-label="模型设置">⚙</button>
      </div>
    </aside>

    <main class="main-stage">
      <header class="stage-header">
        <button id="mobile-back" class="mobile-back" data-action="world-home" aria-label="返回世界">‹</button>
        <div class="stage-heading">
          <span id="stage-eyebrow" class="stage-eyebrow">共享世界</span>
          <h1 id="stage-title">—</h1>
        </div>
        <div class="header-actions">
          <span id="activity-status" class="activity-status" role="status" aria-live="polite"></span>
          <button class="inspector-toggle" data-action="toggle-inspector" aria-expanded="false" aria-controls="inspector">世界书</button>
          <span id="world-clock" class="world-clock">—</span>
          <button class="soft-button" data-action="library">世界书架</button>
        </div>
      </header>

      <section id="world-view" class="view active"></section>
      <section id="chat-view" class="view chat-view"></section>
      <section id="room-view" class="view chat-view"></section>
    </main>

    <button id="inspector-scrim" class="inspector-scrim" data-action="close-inspector" aria-label="关闭视角" tabindex="-1"></button>
    <aside id="inspector" class="inspector"></aside>
  </div>

  <dialog aria-label="让世界开口" id="provider-dialog" class="dialog">
    <form id="provider-form" method="dialog">
      <div class="dialog-head">
        <div><span class="stage-eyebrow">模型连接</span><h2>让世界开口</h2></div>
        <button type="button" class="close-button" aria-label="关闭" data-action="close-settings">×</button>
      </div>
      <label>协议
        <select name="protocol" id="provider-protocol">
          <option value="openai-compatible">OpenAI Compatible</option>
          <option value="anthropic-messages">Anthropic Messages</option>
        </select>
      </label>
      <div class="form-row">
        <label>Base URL<input name="base_url" required spellcheck="false"></label>
        <label>Path<input name="path" required spellcheck="false"></label>
      </div>
      <label>模型<input name="model" required spellcheck="false" placeholder="模型名称"></label>
      <label>API Key<input name="api_key" type="password" autocomplete="off" spellcheck="false" placeholder="留空则保持现有 Key"></label>
      <div class="form-row compact">
        <label>最长回复<input name="max_tokens" type="number" min="256" max="200000"></label>
        <label>温度<input name="temperature" type="number" min="0" max="2" step="0.05"></label>
      </div>
      <div id="provider-feedback" class="form-feedback"></div>
      <div class="dialog-actions">
        <button type="button" class="soft-button" id="test-provider">测试连接</button>
        <button type="submit" class="primary-button">保存</button>
      </div>
    </form>
  </dialog>

  <dialog aria-label="世界底稿" id="world-dialog" class="dialog editor-dialog">
    <form id="world-form" method="dialog">
      <div class="dialog-head">
        <div><span class="stage-eyebrow">WORLD BOOK</span><h2 id="world-dialog-title">世界底稿</h2></div>
        <button type="button" class="close-button" aria-label="关闭" data-action="close-world-editor">×</button>
      </div>
      <section id="world-template-picker" class="template-picker">
        <button type="button" class="template-option active" data-template="">
          <strong>空白世界</strong><span>从一页世界书开始</span>
        </button>
        <button type="button" class="template-option" data-template="velvet_harbor">
          <strong>绯港序章</strong><span>三名角色与一座雾港</span>
        </button>
      </section>
      <input name="template_id" type="hidden" value="">
      <label>这个世界的名字<input name="name" required maxlength="60"></label>
      <label>世界前提<textarea name="premise" rows="3"></textarea></label>
      <label>开场此刻<textarea name="opening_narration" rows="4"></textarea></label>
      <label>气息<input name="atmosphere"></label>
      <label>规则<textarea name="rules" rows="4"></textarea></label>
      <label>此刻<input name="current_time"></label>
      <section id="location-editor" class="editor-subsection">
        <div class="subsection-head"><span>地点</span></div>
        <div id="editor-location-list" class="editor-location-list"></div>
        <div class="new-location">
          <input id="new-location-name" placeholder="新地点">
          <input id="new-location-mood" placeholder="气息">
          <textarea id="new-location-description" rows="2" placeholder="它是什么样的地方"></textarea>
          <button type="button" class="soft-button" id="add-location">加入地点</button>
        </div>
      </section>
      <div class="dialog-actions"><button type="submit" class="primary-button">保存世界</button></div>
    </form>
  </dialog>

  <dialog aria-label="人物底色" id="character-dialog" class="dialog editor-dialog">
    <form id="character-form" method="dialog">
      <div class="dialog-head">
        <div><span class="stage-eyebrow">CHARACTER</span><h2 id="character-dialog-title">人物底色</h2></div>
        <button type="button" class="close-button" aria-label="关闭" data-action="close-character-editor">×</button>
      </div>
      <div class="form-row compact"><label>名字<input name="name" required maxlength="60"></label><label>年龄<input name="age" type="number" min="18" max="999" required></label></div>
      <div class="form-row compact"><label>身份<input name="role"></label><label>所在地点<select name="current_location_id"></select></label></div>
      <label>一句底色<input name="tagline"></label>
      <label>开场牵引<textarea name="opening_hook" rows="3"></textarea></label>
      <label>人格<textarea name="persona" rows="4"></textarea></label>
      <label>说话方式<textarea name="speech_style" rows="3"></textarea></label>
      <label>标志性行为<textarea name="signature_behaviors" rows="3" placeholder="一行一个"></textarea></label>
      <label>失控方式<textarea name="loss_of_control" rows="3"></textarea></label>
      <div class="desire-editor">
        <label>掌控<input name="control" type="range" min="0" max="100" step="1"><span class="desire-hint"></span></label>
        <label>投入<input name="devotion" type="range" min="0" max="100" step="1"><span class="desire-hint"></span></label>
        <label>嫉妒<input name="jealousy" type="range" min="0" max="100" step="1"><span class="desire-hint"></span></label>
        <label>冒险<input name="risk" type="range" min="0" max="100" step="1"><span class="desire-hint"></span></label>
        <label>温柔<input name="tenderness" type="range" min="0" max="100" step="1"><span class="desire-hint"></span></label>
      </div>
      <label>颜色<input name="accent" type="color"></label>
      <input name="pronouns" type="hidden" value="">
      <div class="dialog-actions"><button type="submit" class="primary-button">保存人物</button></div>
    </form>
  </dialog>

  <dialog aria-label="开启一场相遇" id="room-dialog" class="dialog editor-dialog">
    <form id="room-form" method="dialog">
      <div class="dialog-head">
        <div><span class="stage-eyebrow">SAME SCENE</span><h2>开启一场相遇</h2></div>
        <button type="button" class="close-button" aria-label="关闭" data-action="close-room-dialog">×</button>
      </div>
      <label>房间名字<input name="name" maxlength="60" placeholder="例如：三姐妹夜谈"></label>
      <label>场景地点<select name="location_id"><option value="">未定</option></select></label>
      <fieldset><legend>在场的人</legend><div id="room-character-picker" class="room-character-picker"></div></fieldset>
      <div class="dialog-actions"><button type="submit" class="primary-button">开启同场</button></div>
    </form>
  </dialog>

  <dialog aria-label="让这个世界重新开始" id="reset-world-dialog" class="dialog reset-dialog">
    <form id="reset-world-form" method="dialog">
      <div class="dialog-head">
        <div><span class="stage-eyebrow">RETURN TO ORIGIN</span><h2>让这个世界重新开始</h2></div>
        <button type="button" class="close-button" aria-label="关闭" data-action="close-reset-world">×</button>
      </div>
      <div class="reset-warning">
        <div class="reset-rings" aria-hidden="true"><i></i><i></i><i></i></div>
        <p>所有对话、同场房间、世界事实、角色认知与关系进展都会消失。世界书、地点和人物仍会留下。</p>
      </div>
      <label>输入世界名 <strong id="reset-world-name">—</strong> 确认
        <input name="confirmation" autocomplete="off" spellcheck="false">
      </label>
      <div id="reset-world-feedback" class="form-feedback"></div>
      <div class="dialog-actions">
        <button type="button" class="soft-button" data-action="close-reset-world">取消</button>
        <button type="submit" id="confirm-reset-world" class="danger-button" disabled>重置世界</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js?v=13"></script>
</body>
</html>
